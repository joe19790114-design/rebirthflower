  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  }

  .lang-bar {
    position: sticky;

    z-index: 100;
    background: #fff;
    border-bottom: 1px solid #eee;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 8px 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .lang-btn {
    border: 1.5px solid #ddd;
    background: #fff;
    color: #555;
    font-size: 12px;
    font-weight: 600;
    padding: 4px 12px;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.18s;
    white-space: nowrap;
  }
  .lang-btn.active {
    background: #B22222;
    border-color: #B22222;
    color: #fff;
  }

  /* ── Hero ── */
  .hero {
    background: linear-gradient(160deg, #B22222 0%, #7a1313 100%);
    color: #fff;
    padding: 32px 20px 28px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background: url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 40L40 0H20L0 20M40 40V20L20 40' fill='%23ffffff' fill-opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
  }
  .hero-img {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    border: 3px solid rgba(255,255,255,0.3);
    margin: 0 auto 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
    backdrop-filter: blur(4px);
  }
  .hero-name {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: 0.04em;
    margin-bottom: 4px;
  }
  .hero-name-sub {
    font-size: 13px;
    opacity: 0.75;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 16px;
  }
  .hero-info {
    display: flex;
    flex-direction: column;
    gap: 6px;
    align-items: center;
  }
  .hero-info-row {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    opacity: 0.88;
  }
  .hero-info-row svg { flex-shrink: 0; }

  /* ── Category Tabs ── */
  .cat-tabs {
    position: sticky;
    top: 45px;
    z-index: 90;
    background: #fff;
    border-bottom: 2px solid #f0eeeb;
    display: flex;
    overflow-x: auto;
    scrollbar-width: none;
    padding: 0 8px;
  }
  .cat-tabs::-webkit-scrollbar { display: none; }
  .cat-tab {
    flex-shrink: 0;
    padding: 12px 16px;
    font-size: 13px;
    font-weight: 600;
    color: #888;
    cursor: pointer;
    border-bottom: 2.5px solid transparent;
    margin-bottom: -2px;
    transition: all 0.18s;
    white-space: nowrap;
  }
  .cat-tab.active {
    color: #B22222;
    border-bottom-color: #B22222;
  }

  /* ── Menu Section ── */

  .section-header {
    padding: 20px 16px 10px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #B22222;
    border-bottom: 1px solid #f0eeeb;
    margin-bottom: 4px;
  }

  /* ── Item Card ── */
  .item-card {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    background: #fff;
    border-bottom: 1px solid #f5f3f0;
    cursor: pointer;
    transition: background 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .item-card:active { background: #fdf5f5; }
  .item-thumb {
    width: 72px;
    height: 72px;
    border-radius: 12px;
    background: #f5f3f0;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    overflow: hidden;
  }

    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 12px;
  }
  .item-body { flex: 1; min-width: 0; }
  .item-name {
    font-size: 15px;
    font-weight: 700;
    color: #1a1a1a;
    margin-bottom: 4px;
    line-height: 1.3;

  }

  .item-price {

    color: #B22222;
  }

  .item-note {
    font-size: 11px;
    color: #999;
    margin-top: 3px;
    line-height: 1.4;
  }

  /* ── Modal Overlay ── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 200;
    display: flex;
    align-items: flex-end;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
  }
  .modal-overlay.open {
    opacity: 1;
    pointer-events: all;
  }
  .modal-sheet {
    width: 100%;
    max-width: 375px;
    margin: 0 auto;
    background: #fff;
    border-radius: 20px 20px 0 0;
    max-height: 90vh;
    overflow-y: auto;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    -webkit-overflow-scrolling: touch;
  }
  .modal-overlay.open .modal-sheet {
    transform: translateY(0);
  }
  .modal-handle {
    width: 36px;
    height: 4px;
    background: #ddd;
    border-radius: 2px;
    margin: 12px auto 0;
  }
  .modal-close-btn {
    position: absolute;
    top: 16px;
    right: 16px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: rgba(0,0,0,0.08);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    color: #555;
    -webkit-tap-highlight-color: transparent;
  }
  .modal-body { padding: 16px 20px 40px; position: relative; }
  .modal-img {
    width: 100%;
    height: 200px;
    background: #f5f3f0;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 72px;
    margin-bottom: 16px;
    overflow: hidden;

  .modal-img img {

    height: 100%;
    object-fit: cover;
    border-radius: 14px;
    touch-action: pinch-zoom;

    font-weight: 800;
    color: #1a1a1a;
    margin-bottom: 10px;
    line-height: 1.3;

    margin-bottom: 12px;

  .modal-price-table td {
    padding: 6px 0;
    font-size: 14px;
    border-bottom: 1px solid #f0eeeb;

  .modal-price-table td:first-child { color: #666; }
  .modal-price-table td:last-child { text-align: right; font-weight: 700; color: #B22222; }
  .modal-desc, .modal-note {

  .modal-divider {

    text-align: center;

    font-size: 11px;

    line-height: 1.8;

  .footer strong { color: #888; }

  /* ── Utility ── */
  [data-lang] { display: none; }

let savedScrollY = 0;

// ── Helpers ──
function renderTagBadge(code, lang) {
  const t = tagMeta[code];
  if (!t) return '';
  return `<span class="tag-badge tag-${code}">${t.icon} ${t[lang]}</span>`;
}

// ── Build DOM ──
function buildMenu() {
  // Tabs
  const tabsEl = document.getElementById('cat-tabs');
  const catKeys = [...new Set(menuItems.map(i => i.category))];
  tabsEl.innerHTML = catKeys.map((k, idx) =>
    `<div class="cat-tab${idx === 0 ? ' active' : ''}" data-cat="${k}" onclick="scrollToSection('${k}', this)">${categories[k][currentLang]}</div>`
  ).join('');

  // Content
  const contentEl = document.getElementById('menu-content');
  contentEl.innerHTML = catKeys.map(cat => {
    const items = menuItems.filter(i => i.category === cat);
    const cards = items.map(item => {
      const hasTags = item.tags.length > 0;
      const hasNote = item.note[currentLang] !== '';
      const multiPrice = item.price.length > 1;

      const thumbHtml = item.image
        ? `<img src="images/${item.image}" alt="${item.names[currentLang]}" loading="lazy">`
        : item.emoji;

      const tagsHtml = hasTags
        ? `<div class="item-tags">${item.tags.map(t => renderTagBadge(t, currentLang)).join('')}</div>`
        : '';

      const priceHtml = multiPrice
        ? `<div class="item-price-multi">${item.price.map(p => {
            const v = p.value === 'market' ? marketI18n[currentLang] : `NT$${p.value}`;
            return `<div class="item-price-row">${p.label ? `<span class="price-label">${p.label[currentLang]}</span>` : ''}${v}</div>`;
          }).join('')}</div>`
        : `<div class="item-price">${item.price[0].value === 'market' ? marketI18n[currentLang] : 'NT$' + item.price[0].value}</div>`;

      const noteHtml = hasNote
        ? `<div class="item-note">${item.note[currentLang]}</div>`
        : '';

      return `<div class="item-card" onclick="openModal('${item.id}')">
        <div class="item-thumb">${thumbHtml}</div>
        <div class="item-body">
          <div class="item-name">${item.names[currentLang]}</div>
          ${tagsHtml}
          ${priceHtml}
          ${noteHtml}
        </div>
      </div>`;
    }).join('');

    return `<div class="menu-section" id="section-${cat}">
      <div class="section-header">${categories[cat][currentLang]}</div>
      ${cards}
    </div>`;
  }).join('');

  // Footer
  document.getElementById('footer-text').textContent = footerI18n[currentLang];
  // Hero address
  document.getElementById('hero-address').textContent = store.address[currentLang];
  // Hero name
  document.getElementById('hero-name').textContent = store.name[currentLang];
}

// ── Lang Switch ──
function setLang(lang) {
  currentLang = lang;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`.lang-btn[onclick="setLang('${lang}')"]`).classList.add('active');
  buildMenu();
  const firstTab = document.querySelector('.cat-tab');
  if (firstTab) firstTab.classList.add('active');
}

// ── Category Scroll ──
function scrollToSection(cat, tabEl) {
  document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
  tabEl.classList.add('active');
  const target = document.getElementById('section-' + cat);
  if (target) {
    const offset = target.getBoundingClientRect().top + window.scrollY - 90;
    window.scrollTo({ top: offset, behavior: 'smooth' });
  }
}

// Tab highlight on scroll
window.addEventListener('scroll', () => {
  const catKeys = [...new Set(menuItems.map(i => i.category))];
  let active = catKeys[0];
  for (const cat of catKeys) {
    const el = document.getElementById('section-' + cat);
    if (el && el.getBoundingClientRect().top <= 100) active = cat;
  }
  document.querySelectorAll('.cat-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.cat === active);
  });
}, { passive: true });

// ── Modal ──
function openModal(id) {
  savedScrollY = window.scrollY;
  const item = menuItems.find(i => i.id === id);
  if (!item) return;
  const lang = currentLang;

  const thumbHtml = item.image
    ? `<img src="images/${item.image}" alt="${item.names[lang]}" style="touch-action:pinch-zoom">`
    : item.emoji;

  const tagsHtml = item.tags.length
    ? `<div class="modal-tags">${item.tags.map(t => renderTagBadge(t, lang)).join('')}</div>`
    : '';

  let priceHtml = '';
  if (item.price.length === 1 && item.price[0].label === null) {
    const v = item.price[0].value === 'market' ? marketI18n[lang] : `NT$${item.price[0].value}`;
    priceHtml = `<div class="modal-price">${v}</div>`;
  } else {
    const rows = item.price.map(p => {
      const v = p.value === 'market' ? marketI18n[lang] : `NT$${p.value}`;
      const lbl = p.label ? p.label[lang] : '';
      return `<tr><td>${lbl}</td><td>${v}</td></tr>`;
    }).join('');
    priceHtml = `<table class="modal-price-table"><tbody>${rows}</tbody></table>`;
  }

  const descHtml = item.desc[lang]
    ? `<div class="modal-desc">${item.desc[lang]}</div>`
    : '';
  const noteHtml = item.note[lang]
    ? `<div class="modal-note">${item.note[lang]}</div>`
    : '';

  document.getElementById('modal-body').innerHTML = `
    <button class="modal-close-btn" onclick="closeModalDirect()">✕</button>
    <div class="modal-img">${thumbHtml}</div>
    <div class="modal-name">${item.names[lang]}</div>
    ${tagsHtml}
    <div class="modal-divider"></div>
    ${priceHtml}
    ${descHtml}
    ${noteHtml}
  `;

  document.getElementById('modal-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal(e) {
  if (e.target === document.getElementById('modal-overlay')) closeModalDirect();
}

function closeModalDirect() {
  document.getElementById('modal-overlay').classList.remove('open');
  document.body.style.overflow = '';
  window.scrollTo({ top: savedScrollY });
}

// ── Init ──
buildMenu();
</script>
</body>
</html>
